{% extends "base.html" %}
{% block content %}
<h1>Data Explorer</h1>
<p class="small">Pick a country. The graph shows its temperature of every year.
<b>Move your mouse over the graph</b> and a small box tells you that year's temperature.</p>
<div class="panel">
  <label for="country">Select a country:</label>
  <select id="country">
    {% for c in countries %}<option value="{{ c }}" {% if c == 'Pakistan' %}selected{% endif %}>{{ c }}</option>{% endfor %}
  </select>
  <div id="stats" class="statsline"></div>
  <canvas id="countryChart"></canvas>
</div>
<script>
let chart;
async function loadCountry(name) {
  const r = await fetch('/api/country/' + encodeURIComponent(name));
  const d = await r.json();
  document.getElementById('stats').textContent =
    d.country + ': ' + d.records + ' yearly records, ' + d.from + ' to ' + d.to +
    ' | average ' + d.average + ' C | lowest ' + d.minimum + ' C | highest ' + d.maximum + ' C';
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('countryChart'), {type: 'line',
    data: {labels: d.points.map(p => p[0]),
           datasets: [{label: 'Yearly average temperature (C)', data: d.points.map(p => p[1]),
                       borderColor: '#4DA3FF', backgroundColor: 'rgba(77,163,255,0.16)', fill: true,
                       pointRadius: 0, pointHoverRadius: 6, pointHitRadius: 14,
                       pointHoverBackgroundColor: '#FFD34D', pointHoverBorderColor: '#0A1B33',
                       borderWidth: 1.6, tension: 0.15}]},
    options: {responsive: true, interaction: {mode: 'index', intersect: false},
      plugins: {tooltip: {enabled: true, backgroundColor: '#0A1B33', borderColor: '#2E7CF6',
        borderWidth: 1, titleColor: '#FFFFFF', bodyColor: '#EAF3FF', padding: 10, displayColors: false,
        callbacks: {title: items => 'Year ' + items[0].label,
                    label: item => d.country + ': ' + item.parsed.y + ' C average temperature'}}},
      scales: {x: {ticks: {maxTicksLimit: 14}, title: {display: true, text: 'Year'}},
               y: {title: {display: true, text: 'Average temperature (C)'}}}}});
}
document.getElementById('country').addEventListener('change', e => loadCountry(e.target.value));
loadCountry('Pakistan');
</script>
{% endblock %}
