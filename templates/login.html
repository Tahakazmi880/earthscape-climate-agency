{% extends "base.html" %}
{% block title %}Login - EarthScape{% endblock %}
{% block content_login %}
<div class="loginbox">
  <img class="loginlogo" src="{{ url_for('static', filename='earth-logo.jpg') }}" alt="EarthScape logo">
  <h2>EarthScape<br><span>Climate Agency</span></h2>
  <p class="sub">Real-Time Climate Intelligence for a Sustainable Future</p>
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Sign In</button>
  </form>
  <p class="hint">Access is restricted to authorised agency users.</p>
</div>
{% endblock %}
