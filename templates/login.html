{% extends "base.html" %}
{% block title %}Login - EarthScape{% endblock %}
{% block content_login %}
<div class="loginbox">
  <h2>EarthScape Climate Agency</h2>
  <p class="sub">Climate data platform. Please sign in.</p>
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Sign In</button>
  </form>
  <p class="hint">Access is restricted to authorised agency users.</p>
</div>
{% endblock %}
